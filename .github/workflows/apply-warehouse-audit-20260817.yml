name: Apply warehouse integrity audit

on:
  push:
    paths:
      - '.github/workflows/apply-warehouse-audit-20260817.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate warehouse audit migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          anchor = '<script src="consumption_20260814.js?v=2.1.14"></script>'
          audit = '<script src="warehouse_audit_20260817.js?v=2.1.15"></script>'
          if 'warehouse_audit_20260817.js' not in text:
              if anchor not in text:
                  raise SystemExit('consumption script anchor not found')
              text = text.replace(anchor, anchor + '\n' + audit, 1)

          old = "j=window.applyInvoice70702?window.applyInvoice70702(state):false,k=window.applyConsumption20260814?window.applyConsumption20260814(state):false;if(a||b||c||d||e||f||g||h||i||j||k){await cloudSave();return true}return false"
          new = "j=window.applyInvoice70702?window.applyInvoice70702(state):false,k=window.applyConsumption20260814?window.applyConsumption20260814(state):false,l=window.applyWarehouseAudit20260817?window.applyWarehouseAudit20260817(state):false;if(a||b||c||d||e||f||g||h||i||j||k||l){await cloudSave();return true}return false"
          if 'applyWarehouseAudit20260817' not in text:
              if old not in text:
                  raise SystemExit('migration call site not found')
              text = text.replace(old, new, 1)

          text = text.replace('2.1.14', '2.1.15')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'warehouse_audit_20260817.js?v=2.1.15' index.html
          grep -q 'applyWarehouseAudit20260817' index.html
          grep -q 'cloud=2.1.15' index.html

      - name: Commit application update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Run warehouse integrity audit on startup'
          git push
