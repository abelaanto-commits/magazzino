name: Activate Caraibico 04 September consumption

on:
  push:
    paths:
      - '.github/workflows/activate-caraibico-20260904.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activate Caraibico consumption
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script src="supplier_return_20260902.js?v=2.1.30"></script>'
          tag='<script src="consumption_20260904_caraibico.js?v=2.1.31"></script>'
          if 'consumption_20260904_caraibico.js' not in s:
              if anchor not in s: raise SystemExit('script anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1)
          old="u=window.applySupplierReturn20260902?window.applySupplierReturn20260902(state):false;"
          new="u=window.applySupplierReturn20260902?window.applySupplierReturn20260902(state):false,w=window.applyCaraibicoConsumption20260904?window.applyCaraibicoConsumption20260904(state):false;"
          if 'w=window.applyCaraibicoConsumption20260904?' not in s:
              if old not in s: raise SystemExit('migration chain anchor not found')
              s=s.replace(old,new,1)
              s=s.replace('||s||t||v||u){await cloudSave()','||s||t||v||u||w){await cloudSave()',1)
          s=s.replace('2.1.30','2.1.31')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'consumption_20260904_caraibico.js?v=2.1.31' index.html
          grep -q 'w=window.applyCaraibicoConsumption20260904?' index.html
          grep -q 'cloud=2.1.31' index.html
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html consumption_20260904_caraibico.js
          git commit -m 'Load Caraibico 04 September consumption'
          git push
