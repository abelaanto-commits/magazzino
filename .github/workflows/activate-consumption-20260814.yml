name: Activate 14 August consumption

on:
  push:
    paths:
      - 'consumption_20260814.js'
      - '.github/workflows/activate-consumption-20260814.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate consumption migration
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          html = html.replace('2.1.13', '2.1.14')

          script = '<script src="consumption_20260814.js?v=2.1.14"></script>'
          if script not in html:
              anchor = '<script src="invoice_70702_20260805.js?v=2.1.14"></script>'
              if anchor not in html:
                  raise SystemExit('Invoice 70702 script anchor not found')
              html = html.replace(anchor, anchor + '\n' + script, 1)

          old = "j=window.applyInvoice70702?window.applyInvoice70702(state):false;if(a||b||c||d||e||f||g||h||i||j)"
          new = "j=window.applyInvoice70702?window.applyInvoice70702(state):false,k=window.applyConsumption20260814?window.applyConsumption20260814(state):false;if(a||b||c||d||e||f||g||h||i||j||k)"
          if old in html:
              html = html.replace(old, new, 1)
          elif new not in html:
              raise SystemExit('Migration activation anchor not found')

          html = html.replace("app.toast?.('Magazzino aggiornato con le nuove fatture')", "app.toast?.('Magazzino aggiornato')")
          path.write_text(html, encoding='utf-8')

      - name: Validate migration JavaScript
        run: node --check consumption_20260814.js

      - name: Commit activation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Load 14 August consumption into warehouse"
            git push
          fi
