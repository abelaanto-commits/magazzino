name: Activate definitive Pride repair

on:
  push:
    paths:
      - '.github/workflows/activate-pride-repair-20260817.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate Pride repair migration
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          anchor='<script src="warehouse_audit_20260817.js?v=2.1.16"></script>'
          pride='<script src="pride_repair_20260817.js?v=2.1.17"></script>'
          if 'pride_repair_20260817.js' not in s:
              if anchor not in s:
                  raise SystemExit('warehouse audit anchor not found')
              s=s.replace(anchor,anchor+'\n'+pride,1)

          old='l=window.applyWarehouseAudit20260817?window.applyWarehouseAudit20260817(state):false;if(a||b||c||d||e||f||g||h||i||j||k||l){await cloudSave();return true}return false'
          new='l=window.applyWarehouseAudit20260817?window.applyWarehouseAudit20260817(state):false,m=window.applyPrideRepair20260817?window.applyPrideRepair20260817(state):false;if(a||b||c||d||e||f||g||h||i||j||k||l||m){await cloudSave();return true}return false'
          if 'applyPrideRepair20260817' not in s:
              if old not in s:
                  raise SystemExit('migration call site not found')
              s=s.replace(old,new,1)

          s=s.replace('2.1.16','2.1.17')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q 'pride_repair_20260817.js?v=2.1.17' index.html
          grep -q 'applyPrideRepair20260817' index.html
          grep -q 'cloud=2.1.17' index.html

      - name: Commit application update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply definitive Pride consumption repair'
          git push
