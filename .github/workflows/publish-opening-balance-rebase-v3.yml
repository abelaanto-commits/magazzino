name: Publish opening balance rebase v3

on:
  push:
    paths:
      - '.github/workflows/publish-opening-balance-rebase-v3.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cache version
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'opening_balance_rebase_20260818.js' not in s:
              raise SystemExit('opening balance rebase script not found')
          s=s.replace('2.1.22','2.1.23')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'opening_balance_rebase_20260818.js?v=2.1.23' index.html
          grep -q 'cloud=2.1.23' index.html
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish unified lemon and updated vodka balances'
          git push
