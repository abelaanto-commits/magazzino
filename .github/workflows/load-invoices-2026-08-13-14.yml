name: Load August 13-14 invoices

on:
  push:
    paths:
      - '.github/workflows/load-invoices-2026-08-13-14.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch application
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          script_tag = '<script src="invoice_batch_20260813_14.js?v=2.1.9"></script>'
          if script_tag not in text:
              anchor = '<script>\nconst SUPABASE_URL='
              if anchor not in text:
                  raise SystemExit('Main script anchor not found')
              text = text.replace(anchor, script_tag + '\n<script>\nconst SUPABASE_URL=', 1)
          old = "const a=applyInventoryReconciliation(state),b=applyPrideConsumption(state),c=applyFestuniBaileFunkConsumption(state),d=applyFestuniFullDeductionCorrection(state),e=applyAllConsumptionsFinalReconciliation(state),f=applyNucciaSoleConsumption(state),g=applyFestuniXXLConsumption(state);if(a||b||c||d||e||f||g)"
          new = "const a=applyInventoryReconciliation(state),b=applyPrideConsumption(state),c=applyFestuniBaileFunkConsumption(state),d=applyFestuniFullDeductionCorrection(state),e=applyAllConsumptionsFinalReconciliation(state),f=applyNucciaSoleConsumption(state),g=applyFestuniXXLConsumption(state),h=window.applyInvoiceBatchAug1314?window.applyInvoiceBatchAug1314(state):false;if(a||b||c||d||e||f||g||h)"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Migration call site not found')
          text = text.replace("if(migrated)app.toast?.('Consumo Festuni XXL caricato e scalato')", "if(migrated)app.toast?.('Magazzino aggiornato con le nuove fatture')")
          text = text.replace('2.1.8', '2.1.9')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check invoice_batch_20260813_14.js
          python <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?: [^>]*)?>(.*?)</script>', text, re.S)
          Path('/tmp/index.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/index.js

      - name: Commit application update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load invoices for 5, 13 and 14 August 2026'
          git push
