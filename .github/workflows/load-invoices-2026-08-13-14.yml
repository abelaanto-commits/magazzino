name: Load August 13-14 invoices

on:
  push:
    paths:
      - '.github/workflows/load-invoices-2026-08-13-14.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

