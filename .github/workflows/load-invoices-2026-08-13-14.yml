          target = 'async function applyPendingMigrations(){'
          if target not in text:
              raise SystemExit('applyPendingMigrations not found')
          text = text.replace(target, function + '\n' + target, 1)

          old = "const a=applyInventoryReconciliation(state),b=applyPrideConsumption(state),c=applyFestuniBaileFunkConsumption(state),d=applyFestuniFullDeductionCorrection(state),e=applyAllConsumptionsFinalReconciliation(state),f=applyNucciaSoleConsumption(state),g=applyFestuniXXLConsumption(state);if(a||b||c||d||e||f||g)"
          new = "const a=applyInventoryReconciliation(state),b=applyPrideConsumption(state),c=applyFestuniBaileFunkConsumption(state),d=applyFestuniFullDeductionCorrection(state),e=applyAllConsumptionsFinalReconciliation(state),f=applyNucciaSoleConsumption(state),g=applyFestuniXXLConsumption(state),h=applyInvoiceBatchAug1314(state);if(a||b||c||d||e||f||g||h)"
          if old not in text:
              raise SystemExit('Migration call site not found')
          text = text.replace(old, new, 1)
          text = text.replace("if(migrated)app.toast?.('Consumo Festuni XXL caricato e scalato')", "if(migrated)app.toast?.('Magazzino aggiornato con le nuove fatture')")
          text = text.replace('2.1.8', '2.1.9')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?: [^>]*)?>(.*?)</script>', text, re.S)
          Path('/tmp/index.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/index.js

      - name: Commit application update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load invoices for 5, 13 and 14 August 2026'
          git push
