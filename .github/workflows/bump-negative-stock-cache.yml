name: Force refresh latest stock correction

on:
  push:
    paths:
      - '.github/workflows/bump-negative-stock-cache.yml'

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('404.html?cloud=2.1.34', '404.html?cloud=2.1.37')
          s = s.replace('negative_stock_zero_20260911.js?v=2.1.34', 'negative_stock_zero_20260911.js?v=2.1.37')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump stock correction cache version'
          git push
