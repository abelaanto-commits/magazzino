name: Activate Supabase network resilience

on:
  push:
    paths:
      - '.github/workflows/activate-network-resilience-20260826.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add network retry layer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<script src="invoice_batch_20260813_14.js?v=2.1.9"></script>'
          tag='<script src="network_resilience_20260826.js?v=2.1.25"></script>'
          if 'network_resilience_20260826.js' not in s:
              if anchor not in s: raise SystemExit('script anchor not found')
              s=s.replace(anchor,tag+'\n'+anchor,1)
          s=s.replace('2.1.24','2.1.25')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'network_resilience_20260826.js?v=2.1.25' index.html
          grep -q 'cloud=2.1.25' index.html
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Retry transient Supabase network failures'
          git push
