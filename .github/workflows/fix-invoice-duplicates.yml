name: Fix invoice duplicates

on:
  push:
    paths:
      - '.github/workflows/fix-invoice-duplicates.yml'
      - '.github/scripts/fix_invoice_duplicates.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch duplicate handling
        run: python3 .github/scripts/fix_invoice_duplicates.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add warehouse_extensions.js 404.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Prevent duplicate invoices and repair warehouse stock"
            git push
          fi
